name: Build

# 触发方式：
#   1. push 到 main        → 自动编译 + 出三种产物（安装版 / 便携版 / 绿色版）
#   2. 手动 Run workflow   → 想重编随时点一下（可指定版本号后缀，例如本地序号 011）
#   3. 打 v* tag           → 额外把产物发布到 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: '产物名后缀（留空则用 run number，例如本地序号 011 就填 011）'
        required: false
        default: ''

# 同一分支/标签的旧构建自动取消，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # tag 构建时创建 Release 需要

env:
  # 国内 runner 走 npmmirror 更快；GitHub 官方 runner 也完全可用
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build-windows:
    # 必须 Windows runner：产物只有 win 目标（nsis/portable/dir），
    # 且 extraResources 里全是 .exe/.dll（adb/scrcpy）。
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json 里 resolved 已指向 registry.npmmirror.com，
      # 这里显式指定 registry 做双保险（npm ci 默认按 lock 里的 resolved 拉）。
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      # ⚠️ 关键修复：不能指望 npm 自动跑 electron 的 postinstall。
      #    package-lock.json 里 electron 条目**没有 hasInstallScript**，加上 npm 的
      #    allow-scripts 门禁，postinstall 会被跳过 → node_modules/electron/dist 不存在。
      #    而 package.json 里写死了 "electronDist": "node_modules/electron/dist"，
      #    于是 electron-builder 直接报：
      #      ⨯ The specified electronDist does not exist: ...\node_modules\electron\dist
      #    所以这里**显式**跑一次官方下载器（已装则秒退，幂等）。
      - name: 下载 Electron 运行时（补齐 electronDist）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron/dist 已存在，跳过"
          else
            echo "electron/dist 缺失，显式执行官方下载器…"
            node node_modules/electron/install.js
          fi
          # 硬校验：目录与 exe 都必须真的在
          test -f node_modules/electron/dist/electron.exe \
            || { echo "::error::electronDist 下载后仍不存在，请检查 ELECTRON_MIRROR"; exit 1; }
          echo "electron 运行时：$(cat node_modules/electron/path.txt 2>/dev/null || echo '?')"
          du -sh node_modules/electron/dist || true

      - name: 类型检查
        run: npm run typecheck

      - name: 编译（electron-vite build）
        run: npm run build

      # 出三种产物：
      #   nsis     → 安装版（标准向导，可选安装目录、建桌面/开始菜单快捷方式）
      #   portable → 便携版（单文件 exe，双击即用，可拷 U 盘）
      #   dir      → 绿色版（免安装目录，解压就用）——即 win-unpacked
      # 版本号：手动传的 label 优先，否则用 run number（3 位补零）。
      # ⚠️ 产物名不在 package.json 里用 ${env.BUILD_TAG} 拼 —— electron-builder 遇到
      #    未定义的环境变量会直接报错（cannot expand pattern: env BUILD_TAG is not defined），
      #    那样本地 `npm run dist` 就废了。所以这里打包完**手动改名**。
      - name: 打包（安装版 + 便携版 + 绿色版）
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.label }}" ]; then
            SUFFIX="${{ github.event.inputs.label }}"
          else
            SUFFIX=$(printf '%03d' "${{ github.run_number }}")
          fi
          BUILD_TAG="$(date +%Y%m%d)${SUFFIX}"
          APP_VER=$(node -p "require('./package.json').version")
          GREEN="QZRS Scrcpy ${BUILD_TAG}"
          SETUP="QZRS-Scrcpy-Setup-${BUILD_TAG}.exe"
          PORTABLE="QZRS-Scrcpy-Portable-${BUILD_TAG}.exe"
          echo "版本号 ${APP_VER} / 编号 ${BUILD_TAG}"

          # ⚠️ --publish never 必须加：CI 环境下 electron-builder 会自动尝试发布到
          #    GitHub Releases（日志里的 "Implicit publishing triggered by CI detection"），
          #    没有 GH_TOKEN 就直接报错退出：
          #      ⨯ GitHub Personal Access Token is not set, neither programmatically,
          #        nor using env "GH_TOKEN"
          #    产物上传/发布由下面的 upload-artifact 与 action-gh-release 负责。
          npx electron-builder --win nsis portable dir --x64 --publish never

          cd ../release
          # ⚠️ 必须转成原生 Windows 绝对路径（且不带 ..）给后面的 action 用：
          #   1) upload-artifact@v4 拒绝含 '.' / '..' 的 pattern：
          #      Invalid pattern '../release/xxx.exe'. Relative pathing '.' and '..' is not allowed.
          #      实测 @actions/glob 的 fixupPattern 是**见到 .. 就断言失败**，
          #      就算写成 "${workspace}\..\release\x.exe"（前面已绝对）也照样被拒。
          #   2) 直接 $(pwd) 也不行：Git Bash 给的是 MSYS 风格 /d/a/QZRS-Scrcpy/release，
          #      Node 实现的 action 解析不了，会报 No files were found。
          #   所以用 cygpath -w -a 一步到位：原生 Windows 路径 + 消掉 ..
          RELEASE_DIR="$(cygpath -w -a "$(pwd)")"
          case "$RELEASE_DIR" in
            *".."*) echo "::error::RELEASE_DIR 仍含 .. ，upload-artifact 会拒绝：$RELEASE_DIR"; exit 1 ;;
            [A-Za-z]:\\*) ;;
            *) echo "::error::RELEASE_DIR 不是原生 Windows 路径：$RELEASE_DIR"; exit 1 ;;
          esac
          echo "release 目录（Windows 绝对路径）：${RELEASE_DIR}"
          echo "::group::打包原始产物"
          ls -1
          echo "::endgroup::"

          # 改名为带日期的约定名
          mv "QZRS Scrcpy Setup ${APP_VER}.exe"      "$SETUP"
          mv "QZRS Scrcpy ${APP_VER}.exe"            "$PORTABLE"
          if [ -d win-unpacked ]; then
            mv win-unpacked "$GREEN"
          fi
          # 顺手清掉不再需要的元数据（避免被误传到 artifact 里）
          rm -f "QZRS Scrcpy Setup ${APP_VER}.exe.blockmap" latest.yml builder-debug.yml || true

          echo "::group::改名后产物"
          ls -la
          echo "::endgroup::"

          {
            echo "BUILD_TAG=${BUILD_TAG}"
            echo "APP_VER=${APP_VER}"
            echo "GREEN=${GREEN}"
            echo "SETUP=${SETUP}"
            echo "PORTABLE=${PORTABLE}"
            echo "RELEASE_DIR=${RELEASE_DIR}"
          } >> "$GITHUB_ENV"

      # 冒烟校验：三个产物一个都不能少（打包配置漏项在本地踩过坑）
      - name: 校验产物完整性
        shell: bash
        run: |
          set -euo pipefail
          cd ../release

          # 1) 安装版 + 便携版 exe
          for f in "${SETUP}" "${PORTABLE}"; do
            test -f "$f" || { echo "::error::缺少产物：${f}"; ls -la; exit 1; }
            echo "✓ ${f}  $(( $(stat -c%s "$f") / 1048576 )) MB"
          done

          # 2) 绿色版目录：exe + 关键资源都要在
          test -f "${GREEN}/QZRS Scrcpy.exe" \
            || { echo "::error::绿色版缺少 QZRS Scrcpy.exe"; exit 1; }
          for p in resources/adb/adb.exe resources/scrcpy/scrcpy.exe \
                   resources/scrcpy-server resources/app.asar \
                   resources/adb/AdbWinApi.dll resources/scrcpy/SDL3.dll; do
            test -e "${GREEN}/${p}" \
              || { echo "::error::绿色版缺文件：${p}"; exit 1; }
          done
          echo "✓ ${GREEN}/ 绿色版目录完整"

      # 绿色版压成 zip 并校验内容，统一交给脚本做（见脚本头部注释）：
      #   - 不走内联 powershell 命令：三层转义（bash→PS→cmd）在 runner 上行为不可复现，
      #     CI 上就因此误判过一次。
      #   - 不用 Compress-Archive：它遇到读不了的文件**静默跳过**还照样产出 zip，
      #     改成 .NET ZipFile::CreateFromDirectory，失败即抛错。
      #   - 校验时把 \ 归一成 / 再比，避免分隔符差异造成误判。
      - name: 绿色版压成 zip 并校验
        shell: powershell
        run: |
          # 脚本把 zip 写到"当前目录"，所以必须先切到 release 目录；
          # 脚本路径要用绝对/仓库根相对路径（这里先记下仓库根）。
          $root = $PWD.Path
          Set-Location ../release
          & "$root/.github/scripts/generate-green-zip.ps1" -DirName $env:GREEN

      - name: 上传产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: QZRS-Scrcpy-${{ env.BUILD_TAG }}
          # RELEASE_DIR 由打包步骤用 cygpath -w -a 算出：原生 Windows 路径且不含 '..'
          # （upload-artifact@v4 / @actions/glob 见到 '..' 直接断言失败，见打包步骤注释）
          path: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.PORTABLE }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN }}.zip
          if-no-files-found: error
          retention-days: 30

      # 只有打 v* tag 时才发布 Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QZRS Scrcpy ${{ env.BUILD_TAG }}
          files: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.PORTABLE }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 用 find 打印实际产物，好看清路径到底叫什么（带空格的目录名最容易出问题）
      - name: 列出最终产物
        shell: bash
        run: |
          cd ../release
          echo "::group::release 目录"
          ls -la
          echo "::endgroup::"
          echo "SETUP=${SETUP}"
          echo "PORTABLE=${PORTABLE}"
          echo "GREEN=${GREEN}"
          for f in "${SETUP}" "${PORTABLE}" "${GREEN}.zip"; do
            if [ -f "$f" ]; then
              echo "OK   $f  $(( $(stat -c%s "$f") / 1048576 )) MB"
            else
              echo "::error::产物缺失：${f}"
              exit 1
            fi
          done

      - name: 构建摘要
        shell: bash
        run: |
          cd ../release
          setup_mb=$(( $(stat -c%s "${SETUP}") / 1048576 ))
          port_mb=$(( $(stat -c%s "${PORTABLE}") / 1048576 ))
          zip_mb=$(( $(stat -c%s "${GREEN}.zip") / 1048576 ))
          {
            echo "## QZRS Scrcpy 构建完成"
            echo ""
            echo "编号 \`${BUILD_TAG}\` ｜ 提交 \`${GITHUB_SHA:0:7}\` ｜ 触发：${{ github.event_name }}"
            echo ""
            echo "| 产物 | 文件 | 大小 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| 安装版 | \`${SETUP}\` | ${setup_mb} MB | 标准向导安装，可自选目录、建快捷方式 |"
            echo "| 便携版 | \`${PORTABLE}\` | ${port_mb} MB | 单文件，双击即用，可放 U 盘 |"
            echo "| 绿色版 | \`${GREEN}.zip\` | ${zip_mb} MB | 免安装目录，解压即用 |"
            echo ""
            echo "下载：**Actions → 本次 run → Artifacts → QZRS-Scrcpy-${BUILD_TAG}**"
          } >> "$GITHUB_STEP_SUMMARY"
