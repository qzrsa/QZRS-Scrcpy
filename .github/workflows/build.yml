name: Build

# 触发方式：
#   1. push 到 main        → 自动编译 + 出两种产物（安装版 / 绿色版）
#   2. 手动 Run workflow   → 想重编随时点一下（可指定版本号后缀，例如本地序号 011）
#   3. 打 v* tag           → 额外把产物发布到 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: '产物名后缀（留空则用 run number，例如本地序号 011 就填 011）'
        required: false
        default: ''

# 同一分支/标签的旧构建自动取消，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # tag 构建时创建 Release 需要

env:
  # 国内 runner 走 npmmirror 更快；GitHub 官方 runner 也完全可用
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build-windows:
    # 必须 Windows runner：产物只有 win 目标（nsis/dir），
    # 且 extraResources 里全是 .exe/.dll（adb/scrcpy）。
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json 里 resolved 已指向 registry.npmmirror.com，
      # 这里显式指定 registry 做双保险（npm ci 默认按 lock 里的 resolved 拉）。
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      # ⚠️ 关键修复：不能指望 npm 自动跑 electron 的 postinstall。
      #    package-lock.json 里 electron 条目**没有 hasInstallScript**，加上 npm 的
      #    allow-scripts 门禁，postinstall 会被跳过 → node_modules/electron/dist 不存在。
      #    而 package.json 里写死了 "electronDist": "node_modules/electron/dist"，
      #    于是 electron-builder 直接报：
      #      ⨯ The specified electronDist does not exist: ...\node_modules\electron\dist
      #    所以这里**显式**跑一次官方下载器（已装则秒退，幂等）。
      - name: 下载 Electron 运行时（补齐 electronDist）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron/dist 已存在，跳过"
          else
            echo "electron/dist 缺失，显式执行官方下载器…"
            node node_modules/electron/install.js
          fi
          # 硬校验：目录与 exe 都必须真的在
          test -f node_modules/electron/dist/electron.exe \
            || { echo "::error::electronDist 下载后仍不存在，请检查 ELECTRON_MIRROR"; exit 1; }
          echo "electron 运行时：$(cat node_modules/electron/path.txt 2>/dev/null || echo '?')"
          du -sh node_modules/electron/dist || true

      - name: 类型检查
        run: npm run typecheck

      - name: 编译（electron-vite build）
        run: npm run build

      # 出两种产物（**不再出便携版**，原因见下）：
      #   nsis → 安装版（标准向导，可选安装目录、建桌面/开始菜单快捷方式）
      #   dir  → 绿色版（免安装目录，解压就用）——即 win-unpacked
      #
      # ★ 为什么砍掉便携版（portable / 单文件 exe）：
      #   便携版是**单文件** exe，运行中无法替换自己 → 自更新对它天然不成立，
      #   而安装版与绿色版的目录形状完全一样（`QZRS Scrcpy.exe` + `resources/`），
      #   两者都能走同一套「下载 → 摊暂存区 → 退出后助手替换」的增量升级。
      #   留一个永远不能自更新的形态只会让用户以为"更新坏了"。
      #
      # 版本号：手动传的 label 优先，否则用 run number（3 位补零）。
      # ⚠️ 产物名不在 package.json 里用 ${env.BUILD_TAG} 拼 —— electron-builder 遇到
      #    未定义的环境变量会直接报错（cannot expand pattern: env BUILD_TAG is not defined），
      #    那样本地 `npm run dist` 就废了。所以这里打包完**手动改名**。
      - name: 打包（安装版 + 绿色版）
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.label }}" ]; then
            SUFFIX="${{ github.event.inputs.label }}"
          else
            SUFFIX=$(printf '%03d' "${{ github.run_number }}")
          fi
          BUILD_TAG="$(date +%Y%m%d)${SUFFIX}"
          APP_VER=$(node -p "require('./package.json').version")
          GREEN="QZRS Scrcpy ${BUILD_TAG}"
          SETUP="QZRS-Scrcpy-Setup-${BUILD_TAG}.exe"
          # ⚠️ zip 名必须带连字符、不含空格：GitHub 上传 Release 资产时会把它自己
          #    "normalize" —— 空格会被替换成点（实测 QZRS Scrcpy 20260930008.zip
          #    变成了 QZRS.Scrcpy.20260930008.zip），而 action-gh-release 官方文档写明
          #    "the final download name remains GitHub-controlled"，没有 # 之类的改名语法，
          #    治不了。所以从源头就不带空格，同时与 SETUP 风格统一。
          GREEN_ZIP="QZRS-Scrcpy-Green-${BUILD_TAG}.zip"
          echo "版本号 ${APP_VER} / 编号 ${BUILD_TAG}"

          # ⚠️ --publish never 必须加：CI 环境下 electron-builder 会自动尝试发布到
          #    GitHub Releases（日志里的 "Implicit publishing triggered by CI detection"），
          #    没有 GH_TOKEN 就直接报错退出：
          #      ⨯ GitHub Personal Access Token is not set, neither programmatically,
          #        nor using env "GH_TOKEN"
          #    产物上传/发布由下面的 upload-artifact 与 action-gh-release 负责。
          npx electron-builder --win nsis dir --x64 --publish never

          cd ../release
          # ⚠️ 必须转成原生 Windows 绝对路径（且不带 ..）给后面的 action 用：
          #   1) upload-artifact@v4 拒绝含 '.' / '..' 的 pattern：
          #      Invalid pattern '../release/xxx.exe'. Relative pathing '.' and '..' is not allowed.
          #      实测 @actions/glob 的 fixupPattern 是**见到 .. 就断言失败**，
          #      就算写成 "${workspace}\..\release\x.exe"（前面已绝对）也照样被拒。
          #   2) 直接 $(pwd) 也不行：Git Bash 给的是 MSYS 风格 /d/a/QZRS-Scrcpy/release，
          #      Node 实现的 action 解析不了，会报 No files were found。
          #   所以用 cygpath -w -a 一步到位：原生 Windows 路径 + 消掉 ..
          RELEASE_DIR="$(cygpath -w -a "$(pwd)")"
          case "$RELEASE_DIR" in
            *".."*) echo "::error::RELEASE_DIR 仍含 .. ，upload-artifact 会拒绝：$RELEASE_DIR"; exit 1 ;;
            [A-Za-z]:\\*) ;;
            *) echo "::error::RELEASE_DIR 不是原生 Windows 路径：$RELEASE_DIR"; exit 1 ;;
          esac
          echo "release 目录（Windows 绝对路径）：${RELEASE_DIR}"
          echo "::group::打包原始产物"
          ls -1
          echo "::endgroup::"

          # 改名为带日期的约定名
          mv "QZRS Scrcpy Setup ${APP_VER}.exe"      "$SETUP"
          if [ -d win-unpacked ]; then
            mv win-unpacked "$GREEN"
          fi
          # 顺手清掉不再需要的元数据（避免被误传到 artifact 里）
          rm -f "QZRS Scrcpy Setup ${APP_VER}.exe.blockmap" latest.yml builder-debug.yml || true

          echo "::group::改名后产物"
          ls -la
          echo "::endgroup::"

          {
            echo "BUILD_TAG=${BUILD_TAG}"
            echo "APP_VER=${APP_VER}"
            echo "GREEN=${GREEN}"
            echo "GREEN_ZIP=${GREEN_ZIP}"
            echo "SETUP=${SETUP}"
            echo "RELEASE_DIR=${RELEASE_DIR}"
          } >> "$GITHUB_ENV"

      # 冒烟校验：两种产物一个都不能少（打包配置漏项在本地踩过坑）
      - name: 校验产物完整性
        shell: bash
        run: |
          set -euo pipefail
          cd ../release

          # 1) 安装版 exe
          for f in "${SETUP}"; do
            test -f "$f" || { echo "::error::缺少产物：${f}"; ls -la; exit 1; }
            echo "✓ ${f}  $(( $(stat -c%s "$f") / 1048576 )) MB"
          done

          # 2) 绿色版目录：exe + 关键资源都要在
          test -f "${GREEN}/QZRS Scrcpy.exe" \
            || { echo "::error::绿色版缺少 QZRS Scrcpy.exe"; exit 1; }
          for p in resources/adb/adb.exe resources/scrcpy/scrcpy.exe \
                   resources/scrcpy-server resources/app.asar \
                   resources/adb/AdbWinApi.dll resources/scrcpy/SDL3.dll; do
            test -e "${GREEN}/${p}" \
              || { echo "::error::绿色版缺文件：${p}"; exit 1; }
          done
          echo "✓ ${GREEN}/ 绿色版目录完整"

      # 绿色版压成 zip 并校验内容，统一交给脚本做（见脚本头部注释）：
      #   - 不走内联 powershell 命令：三层转义（bash→PS→cmd）在 runner 上行为不可复现，
      #     CI 上就因此误判过一次。
      #   - 不用 Compress-Archive：它遇到读不了的文件**静默跳过**还照样产出 zip，
      #     改成 .NET ZipFile::CreateFromDirectory，失败即抛错。
      #   - 校验时把 \ 归一成 / 再比，避免分隔符差异造成误判。
      - name: 绿色版压成 zip 并校验
        shell: powershell
        run: |
          # 脚本把 zip 写到"当前目录"，所以必须先切到 release 目录；
          # 脚本路径要用绝对/仓库根相对路径（这里先记下仓库根）。
          $root = $PWD.Path
          Set-Location ../release
          & "$root/.github/scripts/generate-green-zip.ps1" -DirName $env:GREEN -ZipName $env:GREEN_ZIP

      # 差量包的基准 = 上一版 Release 的绿色版 zip。
      # ★ 此刻本次还没发布，所以 releases/latest 一定指向"上一个已发布版本"。
      # ★ 拿不到就**跳过差量**，绝不因此失败：差量只是省流量，全量永远是兜底。
      # ★ 首个带 update.json 的版本必然拿不到（上一版没有清单），这是预期的。
      - name: 准备差量基准（上一版）
        shell: bash
        run: |
          set -uo pipefail
          cd ../release
          REPO_URL="https://github.com/${{ github.repository }}/releases/latest/download"
          if ! curl -fsSL --retry 2 -m 60 "$REPO_URL/update.json" -o prev-update.json; then
            echo "::warning::拿不到上一版 update.json（可能是首个带清单的版本）→ 本次只出全量"
            exit 0
          fi
          PREV_VER=$(node -p "require('./prev-update.json').version" 2>/dev/null || true)
          PREV_ASSET=$(node -p "require('./prev-update.json').full.asset" 2>/dev/null || true)
          if [ -z "${PREV_VER:-}" ] || [ -z "${PREV_ASSET:-}" ]; then
            echo "::warning::上一版清单不完整（version=${PREV_VER:-?} asset=${PREV_ASSET:-?}）→ 本次只出全量"
            exit 0
          fi
          if [ "$PREV_VER" = "${APP_VER}" ]; then
            echo "::warning::上一版与本次版本相同（${APP_VER}）→ 不做差量"
            exit 0
          fi
          echo "上一版 ${PREV_VER} / ${PREV_ASSET}"
          if ! curl -fSL --retry 3 -m 1800 "$REPO_URL/$PREV_ASSET" -o prev.zip; then
            echo "::warning::上一版 zip 下载失败 → 本次只出全量"
            exit 0
          fi
          echo "已下上一版 zip $(stat -c%s prev.zip) B"
          echo "PREV_ZIP=$(cygpath -w -a "$(pwd)/prev.zip")" >> "$GITHUB_ENV"
          echo "PREV_VER=${PREV_VER}" >> "$GITHUB_ENV"

      # 自更新清单：客户端（设置 → 软件更新）靠它判断"有没有新版本、要下哪个包"。
      # 与两种产物同属一个 Release，默认更新源是
      #   https://github.com/<owner>/<repo>/releases/latest/download/update.json
      # ★ 必须放在打 zip **之后**：清单里要有 zip 的 sha256，否则全量回退无从校验。
      # ★ 脚本自带硬校验（目录完整性 / 顶层不许有运行时目录），不过就直接失败退出。
      # ★ 有上一版就顺带出一个差量包（块级，只装真正变了的字节）；差量失败只 warn。
      - name: 生成更新清单 update.json（含差量包）
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${PREV_ZIP:-}" ] && [ -n "${PREV_VER:-}" ]; then
            EXTRA=(--old-zip "$PREV_ZIP" --from "$PREV_VER")
          fi
          node tools/make-update-manifest.mjs \
            --new "../release/${GREEN}" \
            --zip "../release/${GREEN_ZIP}" \
            --out "../release" \
            "${EXTRA[@]}"
          test -f "../release/update.json" || { echo "::error::update.json 没有生成"; exit 1; }
          # 顺手清掉差量基准（几百 MB，不参与发布）
          rm -f ../release/prev.zip ../release/prev-update.json || true
          node -e "const m=require('../release/update.json');console.log('清单版本',m.version,'文件',m.files.length,'全量',m.full.asset,'差量',(m.patches||[]).map(p=>p.asset).join(',')||'无')"

      - name: 上传产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: QZRS-Scrcpy-${{ env.BUILD_TAG }}
          # RELEASE_DIR 由打包步骤用 cygpath -w -a 算出：原生 Windows 路径且不含 '..'
          # （upload-artifact@v4 / @actions/glob 见到 '..' 直接断言失败，见打包步骤注释）
          path: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN_ZIP }}
            ${{ env.RELEASE_DIR }}\update.json
            ${{ env.RELEASE_DIR }}\QZRS-Scrcpy-Delta-*.bin
          if-no-files-found: error
          retention-days: 30

      # 只有打 v* tag 时才发布 Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: QZRS Scrcpy ${{ env.BUILD_TAG }}
          # update.json 必须一起发：客户端用 releases/latest/download/update.json 判断更新
          files: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN_ZIP }}
            ${{ env.RELEASE_DIR }}\update.json
            ${{ env.RELEASE_DIR }}\QZRS-Scrcpy-Delta-*.bin
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 用 find 打印实际产物，好看清路径到底叫什么（带空格的目录名最容易出问题）
      - name: 列出最终产物
        shell: bash
        run: |
          cd ../release
          echo "::group::release 目录"
          ls -la
          echo "::endgroup::"
          echo "SETUP=${SETUP}"
          echo "GREEN=${GREEN}"
          echo "GREEN_ZIP=${GREEN_ZIP}"
          for f in "${SETUP}" "${GREEN_ZIP}"; do
            if [ -f "$f" ]; then
              echo "OK   $f  $(( $(stat -c%s "$f") / 1048576 )) MB"
            else
              echo "::error::产物缺失：${f}"
              exit 1
            fi
          done

      - name: 构建摘要
        shell: bash
        run: |
          cd ../release
          setup_mb=$(( $(stat -c%s "${SETUP}") / 1048576 ))
          zip_mb=$(( $(stat -c%s "${GREEN_ZIP}") / 1048576 ))
          # 差量包可能没有（首个版本 / 拿不到上一版）→ 用 || true 兜住，别让摘要步骤挂掉
          DELTA_TEXT=$(node -e "
            const m = require('./update.json');
            const ps = m.patches || [];
            if (!ps.length) { console.log('无（客户端下全量）'); process.exit(0); }
            console.log(ps.map(p => p.asset + ' ｜ ' + (p.size/1048576).toFixed(1) + ' MB（全量的 ' + Math.round(p.ratio*100) + '%）').join('<br>'));
          " 2>/dev/null || echo '无（客户端下全量）')
          {
            echo "## QZRS Scrcpy 构建完成"
            echo ""
            echo "编号 \`${BUILD_TAG}\` ｜ 提交 \`${GITHUB_SHA:0:7}\` ｜ 触发：${{ github.event_name }}"
            echo ""
            echo "| 产物 | 文件 | 大小 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| 安装版 | \`${SETUP}\` | ${setup_mb} MB | 标准向导安装，可自选目录、建快捷方式；**支持增量自动更新** |"
            echo "| 绿色版 | \`${GREEN_ZIP}\` | ${zip_mb} MB | 免安装目录，解压即用；**同样支持增量自动更新** |"
            echo "| 更新清单 | \`update.json\` | $(stat -c%s update.json) B | 客户端「设置 → 软件更新」用 |"
            echo "| 差量包 | ${DELTA_TEXT} | — | 只下变了的块；对不上自动退回全量 |"
            echo ""
            echo "下载：**Actions → 本次 run → Artifacts → QZRS-Scrcpy-${BUILD_TAG}**"
          } >> "$GITHUB_STEP_SUMMARY"
